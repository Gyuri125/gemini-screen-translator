[project]
name = "gemini-screen-translator"
version = "1.2.0"
description = "Real-time, multi-monitor in-game screen capture, AI vision translation, and native TTS speech overlay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gyuri125" }
]
dependencies = [
    "google-genai>=2.13.0",
    "pillow>=10.0.0",
    "pynput>=1.8.0",
    "mss>=9.0.0",
    "python-dotenv>=1.0.0",
    "pystray>=0.19.5",
    "pydantic>=2.0.0",
    "pywin32>=306",
]
